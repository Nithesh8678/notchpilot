name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify toolchain
        run: swift --version
      - name: Unit and dry-run integration tests
        run: ./scripts/test.sh
      - name: Formatting and privacy audit
        run: ./scripts/lint.sh
      - name: Local app bundle
        run: ./scripts/build.sh
