name: Bug report
description: Report a reproducible problem without private content.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use synthetic commands. Do not include contacts, messages, transcripts, audio, or Accessibility snapshots.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS, NotchPilot and affected app versions
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce in Dry Run
